<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join a race · Immortal Chase</title>
  <link rel="manifest" href="/immortal-chase/manifest.webmanifest">
  <meta property="og:title" content="Join my Immortal Chase race!">
  <meta property="og:description" content="Tap to join the room.">
  <meta property="og:image" content="https://kuno2011.github.io/immortal-chase/img/yun.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card">
    <img class="icon hero" src="../img/yun.png" alt="">
    <h1>Join the race!</h1>
    <p class="sub" id="lead">You are invited to an Immortal Chase room.</p>
    <div class="code" id="code"></div>
    <p id="how"><b>Installed the game?</b> Open <b>Immortal Chase</b> from your home screen: it takes you straight into this room.</p>
    <a class="btn" id="go" href="../play/">▶ Join here in the browser</a>
    <a class="btn alt" href="../">📲 Install the game</a>
    <p class="meta">Or open the game, tap <b>Join a race</b> and type the code above.</p>
  </main>
  <script>
    // the room's code comes after the # (immortal-chase/join/#ABCDE); the game joins it from ?join=
    const code = (location.hash.slice(1) || new URLSearchParams(location.search).get('code') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);
    const ok = /^[A-HJKMNP-Z2-9]{5}$/.test(code);
    document.getElementById('code').textContent = ok ? code : '?????';
    if (!ok) document.getElementById('lead').textContent = 'This invitation has no room code. Ask your friend to share it again.';
    if (ok) document.getElementById('go').href = `../play/?join=${code}`;
    // Android does not let an installed web app open links itself: the room's code is kept here (the game shares
    // this site's storage) and the game joins it the next time it opens (within 15 minutes)
    if (ok) try { localStorage.setItem('immortal-chase:invite', JSON.stringify({ code, at: Date.now() })); } catch (e) {}
    else document.getElementById('how').hidden = true;
    // opened in the installed app (Android hands it the link): straight into the room, no tap needed
    if (ok && matchMedia('(display-mode: fullscreen), (display-mode: standalone), (display-mode: minimal-ui)').matches) location.replace(`../play/?join=${code}`);
  </script>
</body>
</html>
