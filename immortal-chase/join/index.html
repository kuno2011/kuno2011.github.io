<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join a race · Immortal Chase</title>
  <meta property="og:title" content="Join my Immortal Chase race!">
  <meta property="og:description" content="Tap to open the game straight in the room.">
  <meta property="og:image" content="https://kuno2011.github.io/immortal-chase/img/icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card">
    <img class="icon" src="../img/icon.png" alt="">
    <h1>Join the race!</h1>
    <p class="sub" id="lead">You are invited to an Immortal Chase room.</p>
    <div class="code" id="code"></div>
    <a class="btn" id="open" href="#">🏮 Open the game in this room</a>
    <a class="btn alt" href="../">⬇ I don't have the game yet</a>
    <p class="meta">If the game does not open: open it yourself, tap <b>Join a race</b> and type the code above.</p>
  </main>
  <script>
    // the room's code comes after the # (immortal-chase/join/#ABCDE); the game opens it from its own link
    const code = (location.hash.slice(1) || new URLSearchParams(location.search).get('code') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);
    const ok = /^[A-HJKMNP-Z2-9]{5}$/.test(code);
    document.getElementById('code').textContent = ok ? code : '?????';
    if (!ok) document.getElementById('lead').textContent = 'This invitation has no room code. Ask your friend to share it again.';
    const fallback = encodeURIComponent(new URL('../', location.href).href);
    const link = /android/i.test(navigator.userAgent)
      ? `intent://join/${code}#Intent;scheme=immortalchase;package=com.kuno.immortalchase;S.browser_fallback_url=${fallback};end`
      : `immortalchase://join/${code}`;
    const btn = document.getElementById('open');
    btn.href = ok ? link : '../';
    // try once on arrival; the button is there if the browser wants a tap first
    if (ok) setTimeout(() => { location.href = link; }, 300);
  </script>
</body>
</html>
